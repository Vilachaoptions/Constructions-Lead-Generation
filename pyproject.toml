[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skool-extractor"
version = "0.1.0"
description = "Extract a Skool.com classroom's lessons, notes, and video transcripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "markdownify>=0.13",
    "yt-dlp>=2024.5.27",
    "youtube-transcript-api>=0.6.2",
    "webvtt-py>=0.5.1",
    "faster-whisper>=1.0.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skool-extractor = "skool_extractor.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = [
    "skool_extractor",
    "skool_extractor.auth",
    "skool_extractor.fetch",
    "skool_extractor.parse",
    "skool_extractor.video",
    "skool_extractor.transcript",
    "skool_extractor.output",
    "webcourse",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
